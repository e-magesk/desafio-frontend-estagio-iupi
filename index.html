<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Frontend - Controle de Despesas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light"> 
    <header class="header">
        <h1 class="page-title">Controle de Despesas</h1>
        <button class="btn-theme-switcher" id="btn-theme-switcher">
            <img class="img-theme-switcher" src="assets/icons/moon.svg"></img>
        </button>
    </header>
    <div class="main-content">
        <div class="card">
            <h3>Adicionar Renda / Despesa</h3>
        </div>
        <div class="div-vertical-orientation">
            <div class="div-horizontal-orientation">
                <div class="card wadget-green">
                    <p> Entradas </p>
                    <h2 id="widget-value-total-income">
                        <!-- O valor da Entrada será preenchido aqui -->
                    </h2>
                </div>
                <div class="card wadget-red">
                    <p> Saídas </p>
                    <h2 id="widget-value-total-expense">
                        <!-- O valor da Saída será preenchido aqui -->
                    </h2>
                </div>
                <div class="card wadget-blue">
                    <p><strong>Saldo Final</strong> </p>
                    <h2 id="widget-value-total-amount">
                        <!-- O valor do Saldo Final será preenchido aqui -->
                    </h2>
                </div>
            </div>
            <div class="card transaction-table">
                <table>
                    <thead>
                        <tr>
                            <th class="th-search" colspan="2">
                                <div class="input-icon">
                                    <img src="assets/icons/search.svg" alt="Buscar">
                                    <input type="search" placeholder="Buscar por descrição..." id="input-search">
                                </div>
                            </th>
                            <th></th>
                            <th class="th-filter">
                                <div class="select-icon">
                                    <img src="assets/icons/sort.svg" alt="Buscar">
                                    <select id="select-filter">
                                        <option selected value="date">Data</option>
                                        <option value="amount">Valor</option>
                                    </select>
                                </div>
                            </th>
                        </tr>
                        <tr>
                            <th class="th-field-name">Descrição</th>
                            <th class="th-field-name">Valor</th>
                            <th class="th-field-name">Data</th>
                            <th class="th-field-name">Tipo</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-transactions">
                        <!-- As transações serão inseridas aqui pela lógica presente no script.js -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4">
                                Total de Transações: &nbsp; <span id="badge-total" class="badge badge-blue"></span>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
