<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Frontend - Controle de Despesas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light"> 
    <header class="header">
        <h1 class="page-title">Controle de Despesas</h1>
        <button class="btn-theme-switcher" id="btn-theme-switcher">
            <img class="img-theme-switcher" src="assets/icons/moon.svg"></img>
        </button>
    </header>
    <div class="main-content">
        <div class="card">
            <h3>Adicionar Renda / Despesa</h3>
            <hr>
        </div>
        <div class="card">
            <h3>Lançamentos &nbsp;&nbsp; 
                <span id="badge-total" class="badge badge-blue">
                    <!-- O valor será preenchido pelo script.js -->
                </span>
            </h3>
            <hr>
            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Data</th>
                        <th>Tipo</th>
                    </tr>
                </thead>
                <tbody id="tbody-transactions">
                    <!-- As transações serão inseridas aqui pela lógica presente no script.js -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
