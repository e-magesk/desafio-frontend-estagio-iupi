<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Frontend - Controle de Despesas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light"> 
    <header>
        <h1 class="page-title"><span class="cifrao-title">$</span> Controle de Despesas</h1>
        <button class="btn-theme-switcher" id="btn-theme-switcher">
            <img class="img-theme-switcher" src="assets/icons/moon.svg"></img>
        </button>
    </header>
    <div class="main-content">
        <div class="card new-transaction">
            <div class="icon-title">
                <img src="assets/icons/plus.svg" alt="Adicionar Transação">
                <h2>Nova Transação</h2>
            </div>
            <form id="form-new-transaction">
                <div class="form-row">
                    <button type="button" id="btn-income" class="btn-income">Entrada</button>
                    <button type="button" id="btn-expense" class="btn-expense">Saída</button>
                </div>
                <div class="form-row">
                    <div class="input-form">
                        <p class="input-form-title">Descrição</p>
                        <input id="input-description" name="description" placeholder="Ex: Salário, Supermercado...">
                        <p id="input-form-validation-description" class="input-form-validation">O preenchimento do campo é obrigatório!</p>
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-form">
                        <p class="input-form-title">Valor (R$)</p>
                        <input id="input-amount" placeholder="0,00" type="text" name="amount">
                        <p id="input-form-validation-amount" class="input-form-validation">O preenchimento do campo é obrigatório!</p>
                    </div>
                    <div class="input-form">
                        <p class="input-form-title">Data</p>
                        <input id="input-date" type="date" name="date">
                        <p id="input-form-validation-date" class="input-form-validation">O preenchimento do campo é obrigatório!</p>
                    </div>
                </div>
                <div class="form-row">
                    <button type="button" id="btn-add-transaction" class="btn-add-transaction">Adicionar Transação</button>
                </div>
            </form>
        </div>
        <div class="div-vertical-orientation">
            <div class="div-horizontal-orientation">
                <div class="card wadget-green">
                    <p> Entradas </p>
                    <h2 id="widget-value-total-income">
                        <!-- O valor da Entrada será preenchido aqui -->
                    </h2>
                </div>
                <div class="card wadget-red">
                    <p> Saídas </p>
                    <h2 id="widget-value-total-expense">
                        <!-- O valor da Saída será preenchido aqui -->
                    </h2>
                </div>
                <div class="card wadget-blue">
                    <p><strong>Saldo Final</strong></p>
                    <h2 id="widget-value-total-amount">
                        <!-- O valor do Saldo Final será preenchido aqui -->
                    </h2>
                </div>
            </div>
            <div class="card card-table">
                <table class="transaction-table">
                    <thead>
                        <tr class="filters">
                            <th class="th-search" colspan="2">
                                <div class="input-icon">
                                    <img src="assets/icons/search.svg" alt="Buscar">
                                    <input type="search" placeholder="Buscar por descrição..." id="input-search">
                                </div>
                            </th>
                            <th></th>
                            <th class="th-filter" colspan="2">
                                <div class="select-icon">
                                    <img src="assets/icons/sort.svg" alt="Buscar">
                                    <select id="select-filter">
                                        <option selected value="-date">Mais recentes</option>
                                        <option value="date">Mais antigas</option>
                                        <option value="-amount">Maior valor</option>
                                        <option value="amount">Menor valor</option>
                                    </select>
                                </div>
                            </th>
                        </tr>
                        <tr>
                            <th class="th-field-name">Descrição</th>
                            <th class="th-field-name">Valor</th>
                            <th class="th-field-name">Data</th>
                            <th class="th-field-name">Tipo</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tbody-transactions">
                        <!-- As transações serão inseridas aqui pela lógica presente no script.js -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3">
                                Total de Transações: &nbsp; <span id="badge-total" class="badge badge-blue"></span>
                            </td>
                            <td colspan="2">
                                <div class="pagination" id="pagination-controls">
                                    <button class="btn-previous-page" id="btn-previous-page">&lt;</button>
                                    <p class="pagination-pages" id="pagination-pages">Página 0 de 0</p>
                                    <button class="btn-next-page" id="btn-next-page">&gt;</button>
                                </div>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
